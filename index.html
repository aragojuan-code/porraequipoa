<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puzle geométrico</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e9e4da}
  body{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .board{width:100%;height:100%;overflow:hidden;border:1px solid #c9c1b4;border-radius:22px;background:#f2eee6}
  canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div class="board"><canvas id="board" aria-label="Tres piezas hexagonales libres sobre una mesa"></canvas></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const MODEL_R=150;
const LINE=MODEL_R/10;
const POS={1:.65,2:.75,3:.85};
const PIECE_FILL='#fffaf0';
const PIECE_STROKE='#282725';
const TABLE_FILL='#f2eee6';
let W=0,H=0,DPR=1,scale=1;

function rad(d){return d*Math.PI/180}
function rot(v,a){const c=Math.cos(a),s=Math.sin(a);return{x:v.x*c-v.y*s,y:v.x*s+v.y*c}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function rotateAround(pt,origin,a){const q=rot({x:pt.x-origin.x,y:pt.y-origin.y},a);return{x:origin.x+q.x,y:origin.y+q.y}}
function reflectAcrossRay(pt,origin,angle){const q=rot({x:pt.x-origin.x,y:pt.y-origin.y},-angle);const w=rot({x:q.x,y:-q.y},angle);return{x:origin.x+w.x,y:origin.y+w.y}}
function circleThrough3(a,b,c){
  const d=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y));
  const aa=a.x*a.x+a.y*a.y,bb=b.x*b.x+b.y*b.y,cc=c.x*c.x+c.y*c.y;
  const x=(aa*(b.y-c.y)+bb*(c.y-a.y)+cc*(a.y-b.y))/d;
  const y=(aa*(c.x-b.x)+bb*(a.x-c.x)+cc*(b.x-a.x))/d;
  return{x,y,r:dist({x,y},a)};
}
function inside(pt,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){
  const a=poly[i],b=poly[j];
  if(((a.y>pt.y)!=(b.y>pt.y))&&(pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x))c=!c;
}return c}

// Geometría canónica del trébol, usada solo para construir las curvas locales.
const O={x:0,y:0};
const centerDirections=[-90,30,150];
const homes=centerDirections.map((deg,i)=>{const a=rad(deg);return{index:i,x:MODEL_R*Math.cos(a),y:MODEL_R*Math.sin(a)}});
const HEX_BASE=rad(90);
const sharedRays=[-30,90,210].map(rad);
const sharedValues=[2,3,1];
function pointOnRay(a,value){const d=MODEL_R*POS[value];return{x:d*Math.cos(a),y:d*Math.sin(a)}}
function canonicalVertices(home,rotation=0){const pts=[];for(let i=0;i<6;i++){
  const a=HEX_BASE+rotation+i*Math.PI/3;
  pts.push({x:home.x+MODEL_R*Math.cos(a),y:home.y+MODEL_R*Math.sin(a)});
}return pts}

const winPts=sharedRays.map((a,i)=>pointOnRay(a,sharedValues[i]));
const solutionCircle=circleThrough3(...winPts);
const pieceEdges=[[-30,210],[-30,90],[90,210]].map(pair=>pair.map(rad));
const physicalWinnerPairs=[[2,1],[2,3],[3,1]];
const physicalEquivalentPairs=[[1,2],[1,2],[2,3]];
const concentricValues=[1,2,3];

const curveDefs=homes.map((home,i)=>{
  const edges=pieceEdges[i];
  const wp=physicalWinnerPairs[i];
  const winner={
    activeRotation:0,
    circle:{...solutionCircle},
    endpoints:[pointOnRay(edges[0],wp[0]),pointOnRay(edges[1],wp[1])]
  };
  let equivalentCircle;
  if(i===0){
    const g=reflectAcrossRay(solutionCircle,O,rad(-90));
    equivalentCircle={x:g.x,y:g.y,r:solutionCircle.r};
  }else{
    const g=rotateAround(solutionCircle,O,rad(120));
    equivalentCircle={x:g.x,y:g.y,r:solutionCircle.r};
  }
  const ep=physicalEquivalentPairs[i];
  const equivalent={
    activeRotation:rad(240),
    circle:equivalentCircle,
    endpoints:[pointOnRay(edges[0],ep[0]),pointOnRay(edges[1],ep[1])]
  };
  const v=concentricValues[i];
  const concentric={
    activeRotation:rad(120),
    circle:{x:0,y:0,r:MODEL_R*POS[v]},
    endpoints:[pointOnRay(edges[0],v),pointOnRay(edges[1],v)]
  };
  return[winner,equivalent,concentric];
});

// Convertimos una sola vez cada curva a coordenadas locales rígidas de su ficha.
curveDefs.forEach((defs,i)=>{
  const home=homes[i];
  defs.forEach(d=>{
    const undo=-d.activeRotation;
    d.localCenter=rot({x:d.circle.x-home.x,y:d.circle.y-home.y},undo);
    d.localEnds=d.endpoints.map(e=>rot({x:e.x-home.x,y:e.y-home.y},undo));
    const e0=d.endpoints[0],e1=d.endpoints[1],c=d.circle;
    const a0=Math.atan2(e0.y-c.y,e0.x-c.x),a1=Math.atan2(e1.y-c.y,e1.x-c.x);
    d.localA0=a0-d.activeRotation;
    d.localA1=a1-d.activeRotation;
    const poly=canonicalVertices(home,d.activeRotation);
    const midCW=a0+((a1-a0+TAU)%TAU)/2;
    const midCCW=a0-((a0-a1+TAU)%TAU)/2;
    const m1={x:c.x+c.r*Math.cos(midCW),y:c.y+c.r*Math.sin(midCW)};
    const m2={x:c.x+c.r*Math.cos(midCCW),y:c.y+c.r*Math.sin(midCCW)};
    d.ccw=inside(m2,poly)&&!inside(m1,poly);
  });
});

const pieces=[
  {index:0,x:0,y:0,rotation:rad(-17)},
  {index:1,x:0,y:0,rotation:rad(28)},
  {index:2,x:0,y:0,rotation:rad(-39)}
];
let drawOrder=[0,1,2];
let initialized=false;

function setInitialPositions(){
  const r=MODEL_R*scale;
  pieces[0].x=W*.27; pieces[0].y=H*.36; pieces[0].rotation=rad(-17);
  pieces[1].x=W*.69; pieces[1].y=H*.34; pieces[1].rotation=rad(28);
  pieces[2].x=W*.50; pieces[2].y=H*.72; pieces[2].rotation=rad(-39);
  // En pantallas estrechas reducimos un poco la separación manteniendo las piezas sueltas.
  if(W<650){
    pieces[0].x=W*.28; pieces[0].y=H*.30;
    pieces[1].x=W*.70; pieces[1].y=H*.42;
    pieces[2].x=W*.38; pieces[2].y=H*.73;
  }
  pieces.forEach(p=>keepInside(p));
  separateAll();
}

function resize(){
  const rect=canvas.getBoundingClientRect();
  const oldW=W,oldH=H;
  W=Math.max(1,rect.width);H=Math.max(1,rect.height);
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=Math.min(W/1050,H/760);
  scale=Math.max(.48,Math.min(scale,1.35));
  if(!initialized){setInitialPositions();initialized=true}
  else if(oldW&&oldH){
    const sx=W/oldW,sy=H/oldH;
    pieces.forEach(p=>{p.x*=sx;p.y*=sy;keepInside(p)});
    separateAll();
  }
  draw();
}

function pieceVertices(p,x=p.x,y=p.y,rotation=p.rotation){
  const r=MODEL_R*scale,pts=[];
  for(let i=0;i<6;i++){
    const a=HEX_BASE+rotation+i*Math.PI/3;
    pts.push({x:x+r*Math.cos(a),y:y+r*Math.sin(a)});
  }
  return pts;
}
function pathPoly(poly){ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i].x,poly[i].y);ctx.closePath()}
function transformLocal(p,v){const q=rot({x:v.x*scale,y:v.y*scale},p.rotation);return{x:p.x+q.x,y:p.y+q.y}}
function drawPiece(p){
  const poly=pieceVertices(p);
  ctx.save();
  pathPoly(poly);
  ctx.fillStyle=PIECE_FILL;
  ctx.fill();
  ctx.strokeStyle=PIECE_STROKE;
  ctx.lineWidth=Math.max(1.8,2.6*scale);
  ctx.lineJoin='round';
  ctx.stroke();
  ctx.clip();
  for(const d of curveDefs[p.index]){
    const c=transformLocal(p,d.localCenter);
    ctx.beginPath();
    ctx.arc(c.x,c.y,d.circle.r*scale,d.localA0+p.rotation,d.localA1+p.rotation,d.ccw);
    ctx.strokeStyle='#222220';
    ctx.lineWidth=LINE*scale;
    ctx.lineCap='butt';
    ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=TABLE_FILL;ctx.fillRect(0,0,W,H);
  drawOrder.forEach(i=>drawPiece(pieces[i]));
}

function project(poly,axis){let min=Infinity,max=-Infinity;for(const p of poly){const v=p.x*axis.x+p.y*axis.y;min=Math.min(min,v);max=Math.max(max,v)}return{min,max}}
function polygonCenter(poly){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y}return{x:x/poly.length,y:y/poly.length}}
// Devuelve el vector mínimo que debe aplicarse a B para separarlo de A.
function satMTV(polyA,polyB){
  let smallest=Infinity,bestAxis=null;
  for(const poly of [polyA,polyB]){
    for(let i=0;i<poly.length;i++){
      const p=poly[i],q=poly[(i+1)%poly.length];
      const edge={x:q.x-p.x,y:q.y-p.y};
      const len=Math.hypot(edge.x,edge.y)||1;
      const axis={x:-edge.y/len,y:edge.x/len};
      const a=project(polyA,axis),b=project(polyB,axis);
      const overlap=Math.min(a.max,b.max)-Math.max(a.min,b.min);
      if(overlap<=.25)return null;
      if(overlap<smallest){smallest=overlap;bestAxis=axis}
    }
  }
  const ca=polygonCenter(polyA),cb=polygonCenter(polyB);
  if((cb.x-ca.x)*bestAxis.x+(cb.y-ca.y)*bestAxis.y<0)bestAxis={x:-bestAxis.x,y:-bestAxis.y};
  return{x:bestAxis.x*(smallest+.8),y:bestAxis.y*(smallest+.8)};
}
function keepInside(p){
  const pad=3,poly=pieceVertices(p);
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const v of poly){minX=Math.min(minX,v.x);maxX=Math.max(maxX,v.x);minY=Math.min(minY,v.y);maxY=Math.max(maxY,v.y)}
  if(minX<pad)p.x+=pad-minX;
  if(maxX>W-pad)p.x-=maxX-(W-pad);
  if(minY<pad)p.y+=pad-minY;
  if(maxY>H-pad)p.y-=maxY-(H-pad);
}
function separateAll(){
  for(let pass=0;pass<18;pass++){
    let changed=false;
    for(let i=0;i<pieces.length;i++)for(let j=i+1;j<pieces.length;j++){
      const mtv=satMTV(pieceVertices(pieces[i]),pieceVertices(pieces[j]));
      if(mtv){pieces[i].x-=mtv.x/2;pieces[i].y-=mtv.y/2;pieces[j].x+=mtv.x/2;pieces[j].y+=mtv.y/2;keepInside(pieces[i]);keepInside(pieces[j]);changed=true}
    }
    if(!changed)break;
  }
}
function pushOthers(active){
  const queue=[active];
  let safety=0;
  while(queue.length&&safety++<40){
    const mover=queue.shift();
    for(const other of pieces){
      if(other===mover)continue;
      const mtv=satMTV(pieceVertices(mover),pieceVertices(other));
      if(!mtv)continue;
      other.x+=mtv.x;other.y+=mtv.y;
      const before={x:other.x,y:other.y};
      keepInside(other);
      // Si el borde impide mover completamente a la otra, retrocede lo mínimo la activa.
      const residual=satMTV(pieceVertices(mover),pieceVertices(other));
      if(residual&&mover===active){
        active.x-=residual.x;active.y-=residual.y;keepInside(active);
      }
      if(Math.hypot(other.x-before.x,other.y-before.y)<1000)queue.push(other);
    }
  }
  // Limpieza final de pequeñas penetraciones numéricas.
  for(let pass=0;pass<8;pass++){
    let changed=false;
    for(let i=0;i<pieces.length;i++)for(let j=i+1;j<pieces.length;j++){
      const a=pieces[i],b=pieces[j],mtv=satMTV(pieceVertices(a),pieceVertices(b));
      if(!mtv)continue;
      if(a===active){b.x+=mtv.x;b.y+=mtv.y;keepInside(b)}
      else if(b===active){a.x-=mtv.x;a.y-=mtv.y;keepInside(a)}
      else{a.x-=mtv.x/2;a.y-=mtv.y/2;b.x+=mtv.x/2;b.y+=mtv.y/2;keepInside(a);keepInside(b)}
      changed=true;
    }
    if(!changed)break;
  }
}

const gesture={piece:null,pointers:new Map(),startPiece:null,startPointer:null,startMid:null,startAngle:0,startRotation:0};
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function topPieceAt(pt){for(let k=drawOrder.length-1;k>=0;k--){const p=pieces[drawOrder[k]];if(inside(pt,pieceVertices(p)))return p}return null}
function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}
function bringToFront(p){drawOrder=drawOrder.filter(i=>i!==p.index);drawOrder.push(p.index)}
function beginSingle(p,pt){
  gesture.piece=p;gesture.startPiece={x:p.x,y:p.y,rotation:p.rotation};gesture.startPointer=pt;
  bringToFront(p);
}
function resetPinch(){
  const pts=[...gesture.pointers.values()];
  if(pts.length<2||!gesture.piece)return;
  gesture.startMid=midpoint(pts[0],pts[1]);
  gesture.startAngle=angle(pts[0],pts[1]);
  gesture.startRotation=gesture.piece.rotation;
  gesture.startPiece={x:gesture.piece.x,y:gesture.piece.y,rotation:gesture.piece.rotation};
}
canvas.addEventListener('pointerdown',e=>{
  const pt=pointerPos(e);
  canvas.setPointerCapture(e.pointerId);
  if(!gesture.piece){
    const p=topPieceAt(pt);if(!p)return;
    gesture.pointers.set(e.pointerId,pt);beginSingle(p,pt);
  }else{
    gesture.pointers.set(e.pointerId,pt);
    if(gesture.pointers.size===2)resetPinch();
  }
  e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
  if(!gesture.pointers.has(e.pointerId)||!gesture.piece)return;
  gesture.pointers.set(e.pointerId,pointerPos(e));
  const p=gesture.piece,pts=[...gesture.pointers.values()];
  if(pts.length===1){
    const pt=pts[0];
    p.x=gesture.startPiece.x+(pt.x-gesture.startPointer.x);
    p.y=gesture.startPiece.y+(pt.y-gesture.startPointer.y);
  }else{
    const mid=midpoint(pts[0],pts[1]);
    p.x=gesture.startPiece.x+(mid.x-gesture.startMid.x);
    p.y=gesture.startPiece.y+(mid.y-gesture.startMid.y);
    let da=angle(pts[0],pts[1])-gesture.startAngle;
    while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;
    p.rotation=gesture.startRotation+da;
  }
  keepInside(p);pushOthers(p);draw();e.preventDefault();
});
function endPointer(e){
  if(!gesture.pointers.has(e.pointerId))return;
  gesture.pointers.delete(e.pointerId);
  if(gesture.pointers.size===1&&gesture.piece){
    const pt=[...gesture.pointers.values()][0];
    gesture.startPointer=pt;
    gesture.startPiece={x:gesture.piece.x,y:gesture.piece.y,rotation:gesture.piece.rotation};
  }else if(gesture.pointers.size===0){
    gesture.piece=null;gesture.startPiece=null;gesture.startPointer=null;gesture.startMid=null;
  }
  draw();e.preventDefault();
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
window.addEventListener('resize',resize,{passive:true});
resize();
})();
</script>
</body>
</html>
